spring.application.name=proyecto-final-sistemas
server.port=8080

spring.datasource.url=jdbc:h2:mem:granja;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.auth.username=${APP_AUTH_USERNAME:admin}
app.auth.password=${APP_AUTH_PASSWORD:admin123}
# CORS: origenes que pueden consumir la API desde el navegador
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://iumoni.github.io,http://localhost:*,http://127.0.0.1:*,https://*.app.github.dev}

# Incluye el mensaje de error (ej. "Especie no encontrada") en las respuestas
spring.web.error.include-message=always

# Nivel de logs de la aplicacion (peticiones y errores)
logging.level.com.proyectofinal.sistemas=INFO
